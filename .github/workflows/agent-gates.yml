name: agent-gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  issues: read

# Deterministic, read-only module resolution (Issue #85): any drift in
# go.mod/go.sum fails the build instead of silently mutating files.
env:
  GOFLAGS: -mod=readonly

jobs:
  baseline:
    name: Gate G0 — fmt/vet/build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go mod verify
        run: go mod verify

  race:
    name: Gate G1 — go test -race
    needs: baseline
    continue-on-error: false # grün seit Issue #2/#3 (bleve v1.0.14, bbolt 1.3.5; Parser-Stats-Race gefixt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: go test -race
        run: go test -race -count=1 ./...

  vuln:
    name: Gate G1 — govulncheck
    needs: baseline
    continue-on-error: false # blockierend seit #82 (0 aufgerufene Vulns; Ausnahmen s. docs/QUALITY-GATES.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Gate G0/G2 — golangci-lint
    needs: baseline
    continue-on-error: false # blockierend seit GO-1 (#84); Lint ist grün
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # pinned (Issue #142); v2 schema in .golangci.yml
          args: --timeout=3m

  coverage:
    name: Gate G2 — Abdeckung nicht fallend
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Measure coverage
        run: |
          go test -coverprofile=/tmp/cov.out ./... > /dev/null
          total=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $NF}' | tr -d '%')
          echo "coverage=${total}%"
          # Gate aktiv seit #39 (Vertrag docs/QUALITY-GATES.md): Gesamtwert darf
          # nicht unter die Baseline 50,9% (2026-11-07) sinken.
          awk -v t="$total" 'BEGIN{ if (t+0 < 50.9) { print "COVERAGE DROPPED", t; exit 1 } }'
      - name: Upload coverage artifact (PR-visible -cover diff)
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: /tmp/cov.out
          if-no-files-found: error

  hygiene:
    name: Gate — Issue/Milestone-Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check open issues have milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          missing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,milestone --jq '[.[] | select(.milestone == null)] | length')
          echo "issues without milestone: $missing"
          if [ "$missing" != "0" ]; then echo "Alle Issues müssen einem Milestone zugeordnet sein"; exit 1; fi

  sbom:
    name: Gate — SBOM & Checksums
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build binary
        run: go build -o /tmp/ekanited ./cmd/ekanited
      - name: Generate SBOM (go version -m) + checksums
        run: |
          go version -m /tmp/ekanited > /tmp/sbom.txt
          sha256sum /tmp/ekanited > /tmp/checksums.txt
          echo "SBOM modules: $(grep -c 'mod' /tmp/sbom.txt)"
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            /tmp/sbom.txt
            /tmp/checksums.txt
          if-no-files-found: error

  complexity:
    name: Komplexität (gocyclo, informativ)
    needs: baseline
    continue-on-error: true # informativ/nicht blockierend (Issue #87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gocyclo (Top-10 + Durchschnitt, informativ)
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -top 10 -avg .
