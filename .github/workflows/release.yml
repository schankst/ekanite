name: publish-release

# Release pipeline (Issue #138): triggered by a v* tag, builds archived
# binaries with checksums + SBOM via GoReleaser and pushes a GHCR image.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Docker Buildx (multi-platform image)
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/schankst/ekanite:${GITHUB_REF_NAME#v}
            ghcr.io/schankst/ekanite:latest
          build-args: |
            VERSION=${GITHUB_REF_NAME}
            COMMIT=${GITHUB_SHA::12}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "latest"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SBOM per release (Issue #82/#138): emit the resolved module graph as a
      # release SBOM alongside the binary checksums. Derived from the repository
      # module graph (deterministic, no dependency on dist/ layout).
      - name: Generate SBOM
        run: |
          {
            echo "module: github.com/schankst/ekanite"
            echo "release: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA::12}"
            go list -m all
          } > sbom.txt
          gh release upload "${GITHUB_REF_NAME}" sbom.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
