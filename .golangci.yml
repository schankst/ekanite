# golangci-lint configuration — Issue #84 (GO-1)
# Recommended linter set: gofmt, govet, errcheck, staticcheck, gosimple, unused.
linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
  disable-all: true
  fast: false

issues:
  # The codebase predates these linters; after #84 all findings are fixed and
  # the lint gate becomes blocking. New code must stay lint-clean.
  max-same-issues: 0
  max-issues-per-linter: 0

run:
  timeout: 3m
  tests: true
